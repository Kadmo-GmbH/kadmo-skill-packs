schema_version: 1
version: "1.0.0"
last_verified: "2025-12-21"
id: wikipedia_summarize_browser
title: "Summarize (Browser)"
description: "Opens a Wikipedia article, extracts its content, and generates an LLM-powered summary. Supports tldr, concise (default), or detailed styles."
overview: |
  A one-shot research chain that composes open-article, extract-content, and an LLM summarisation step. Given a topic, it navigates to the article, pulls the main body text, and produces a summary at one of three lengths — a headline tldr, a standard concise summary (the default), or a detailed multi-paragraph rundown for research contexts.

  Use this whenever an agent needs a digestible version of a Wikipedia topic as part of a larger task — fact-checking, onboarding context, stub content for a draft. The raw extracted text is also returned alongside the summary when callers need to cite specifics.

category:
  level: workflow
  domain: research
  reusable: true
params:
  topic: string
  style: string  # Optional: tldr | concise | detailed (default: concise)
policies:
  allowed_domains:
    - wikipedia.org
    - "*.wikipedia.org"
steps:
  # Step 1: Open the Wikipedia article
  - type: workflow.call
    workflow: wikipedia_open
    params:
      topic: "{{topic}}"

  # Step 2: Extract content from the page
  - type: workflow.call
    workflow: wikipedia_extract_content
    as: article

  # Step 3: Generate LLM summary with style
  - type: workflow.call
    workflow: llm_summarize
    params:
      content: "{{article.content}}"
      style: "{{style}}"
    as: result

  # Output the summary
  - type: control.stop
    message: "{{result.summary}}"
